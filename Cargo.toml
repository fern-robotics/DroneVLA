[package]
name = "dronevl"
version = "0.1.0"
edition = "2021"
description = "DroneVL-RS: Rust instantiation of the DroneVL thesis experiment protocol"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
regex = "1"
rayon = "1"
png = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
