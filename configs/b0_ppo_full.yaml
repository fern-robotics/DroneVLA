name: b0_ppo_full_pool
base_checkpoint: /workspace/openvla-uav
train_tasks: /workspace/uavflow_train_tasks
test_tasks: /workspace/UAV-Flow/UAV-Flow-Eval/test_jsons
manifest: /workspace/runs/b0_ppo_100/manifest.json
seed: 7
sample_tasks: 100
engines: 3
group_size: 3
max_steps: adaptive
max_steps_formula: "min(400, max(50, ceil(1.5 * len(reference_path_raw))))"
contract:
  prompt_style: openvla_uav
  state: local_xyz_yaw_deg_cm
  action_mode: absolute
  action_scale: 1.0
ppo:
  lr: 5.0e-6
  clip_low: 0.20
  clip_high: 0.28
  gamma: 0.99
  lam: 0.95
  value_coef: 0.5
  entropy_coef: 0.0
  epochs: 1
  updates: 100
  lora_r: 32
  lora_alpha: 16
  lora_target: all-linear
  value_head: first_action_token_3layer
eval:
  split: test
  workers: 2
  rollouts_per_task: 1
  metrics: [success_rate, ndtw]
